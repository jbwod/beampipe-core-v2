apiVersion: beampipe.dev/v2
kind: ProjectConfig
metadata:
  id: minimal_survey
  description: Project-neutral catalog and manifest example

definitions:
  transforms:
    trim:
      kind: trim
    lowercase:
      kind: lowercase

source_identity:
  canonical: source_identifier
  template_vars:
    source_identifier:
      from: canonical
    source_name:
      transform: lowercase

adapters:
  required:
    - catalog
  endpoints:
    catalog:
      url: https://catalog.example.invalid/tap
      mode: sync_post
  tap:
    timeout_seconds: 60
    retries: 1

staging:
  provider: none

graph:
  path: config/examples/neutral_demo.graph
  sha256: f1feee266fcdbdc7006e090533b94ec3d8bee14d91b11b7b9dcb22bcc8ef21c3

discovery:
  queries:
    - name: records
      adapter: catalog
      template: |
        SELECT object_id, collection_id, access_url
        FROM project_records
        WHERE source_id = '{source_identifier}'
  prepare_metadata:
    field_map:
      source_identifier:
        from: source_identifier
      group_key:
        from: collection_id
      record_id:
        from: object_id
    required_fields:
      - access_url

manifest:
  group_by:
    - source_identifier
  source_template:
    source_identifier: "{source_identifier}"
  record_template:
    record_id: "{record_id}"
    access_url: "{access_url}"

output_verification:
  required: true
  inventory_schema: beampipe-output-inventory/v1
  expected_patterns:
    - "**/result.bin"

automation:
  discovery:
    enabled: true
    batch_size: 10
    tick_discovery_batch_limit: 10
    concurrent_discovery_batch_limit: 4
    stale_after_hours: 24
