docs_dir: boilerplate_docs

site_name: beampipe operator docs
site_description: Operate and extend Beampipe, the Rust control plane for archive-driven radio astronomy workflows.
site_author: Jack Blackwood
site_url: https://beampipe-core.readthedocs.io/

theme:
  name: material
  custom_dir: boilerplate_docs/overrides
  font: false
  logo: assets/brand/beampipe-terminal-icon.png
  favicon: assets/brand/beampipe-terminal-icon.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: blue

plugins:
  - search

nav:
  - Home: index.md
  - Start:
      - Quick start: getting-started/index.md
      - Install and configure: getting-started/installation.md
      - Deployment topologies: getting-started/deployment.md
      - Dashboard tour: getting-started/dashboard.md
      - First workflow: getting-started/first-run.md
      - REST demonstration playbook: getting-started/rest-no-downloads-demo.md
  - Operate:
      - Operator handbook: operations/index.md
      - Workers and scheduling: operations/workers-scheduling.md
      - Observability: operations/observability.md
      - Recovery and cancellation: operations/recovery.md
      - Production runbook: operations/production-runbook.md
      - Qualification run: operations/end-to-end-demo.md
  - Configure projects:
      - Project YAML: project-configs/index.md
      - Transforms: project-configs/transforms.md
      - Graph preparation: project-configs/graph-patches.md
      - Deployment profiles and SSH: architecture/deployment-profiles.md
  - Understand:
      - Architecture: architecture/index.md
      - Installation setup audit: architecture/installation-setup-audit.md
      - Execution state model: architecture/state-machine.md
  - Reference:
      - CLI commands: reference/cli.md
      - API workflow: api/index.md
      - API schema: api/reference.md
      - Glossary: reference/glossary.md
  - Engineering:
      - Contributing: contributing.md

exclude_docs: |
  overrides/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jbwod/beampipe-core-v2

extra_css:
  - stylesheets/extra.css
  - stylesheets/redoc.css

extra_javascript:
  - javascripts/terminal-ui.js
  - javascripts/install-builder.js
  - javascripts/redoc-init.js

repo_name: jbwod/beampipe-core-v2
repo_url: https://github.com/jbwod/beampipe-core-v2
edit_uri: edit/main/boilerplate_docs/
