apiVersion: beampipe.dev/v2
kind: ProjectConfig
metadata:
  id: wallaby_hires
  description: WALLABY HiRes Beampipe test pipeline without download drops

definitions:
  transforms:
    hipass_source_name:
      kind: strip_prefix
      prefix: HIPASS
    askap_sbid:
      kind: extract_digits
    scan_id_from_did:
      kind: split_last
      separators: ["/", ":", "#"]
    has_rows:
      kind: is_present
    ra_hms:
      kind: degrees_to_hms
    dec_dms:
      kind: degrees_to_dms
    normalized_sbid:
      kind: chain
      steps: [askap_sbid, trim]
    trim:
      kind: trim

source_identity:
  canonical: source_identifier
  template_vars:
    source_identifier:
      from: canonical
    source_name:
      transform: hipass_source_name

adapters:
  required:
    - casda
    - vizier
  endpoints:
    casda:
      url: https://casda.csiro.au/casda_vo_tools/tap/sync
      mode: sync_get
    vizier:
      url: https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync
      mode: sync_post
  tap:
    timeout_seconds: 90
    retries: 2

staging:
  provider: none

graph:
  # Vendored from wallaby-hires-beampipe commit 5fb72fdb13f44642fafd0d9b918b79210511ee00.
  path: config/graphs/wallaby-hires_test-pipeline-nodownloads-beampipe.graph
  sha256: f2f5db47b7b30c12ab00c7eb0c868a0a14f4000f5706f15a6a27a5ec6e17267a

discovery:
  queries:
    - name: visibility
      adapter: casda
      template: |
        SELECT o.* FROM ivoa.obscore o
        INNER JOIN (
          SELECT MAX(t_max) AS mx FROM ivoa.obscore
          WHERE filename LIKE '{source_identifier}%'
          AND obs_collection IN ('ASKAP Pilot Survey for WALLABY', 'WALLABY')
        ) AS latest ON o.t_max = latest.mx
        WHERE o.filename LIKE '{source_identifier}%'
        AND o.obs_collection IN ('ASKAP Pilot Survey for WALLABY', 'WALLABY')
    - name: ra_dec_vsys
      adapter: vizier
      result: exactly_one
      required: true
      template: |
        SELECT HIPASS, RAJ2000, DEJ2000, RV50max, RV50min, RVmom
        FROM "VIII/73/hicat" WHERE HIPASS = '{source_name}'
  enrichments:
    - name: calibration_metadata
      adapter: casda
      for_each:
        field: group_key
        variable: sbid
      result: exactly_one
      required: true
      template: |
        SELECT * FROM casda.observation_evaluation_file
        WHERE sbid = '{sbid}'
        AND format = 'calibration'
        AND filename LIKE 'calibration-metadata-processing-logs-SB{sbid}_%.tar'
  prepare_metadata:
    field_map:
      source_identifier:
        from: source_identifier
      record_id:
        from: filename
      visibility_filename:
        from: filename
      group_key:
        from: obs_id
        transform: normalized_sbid
      staging_id:
        from: obs_publisher_did
        transform: scan_id_from_did
      group_artifact_filename:
        from: enrichments.calibration_metadata.filename
      group_artifact_access_url:
        from: enrichments.calibration_metadata.access_url
    discovery_flags:
      ra_dec_vsys_complete:
        from: enrichments.ra_dec_vsys
        transform: has_rows
      ra_string:
        from: enrichments.ra_dec_vsys.RAJ2000
        transform: ra_hms
      dec_string:
        from: enrichments.ra_dec_vsys.DEJ2000
        transform: dec_dms
      vsys:
        from: enrichments.ra_dec_vsys.RVmom
    signature:
      exclude_fields:
        - access_url
        - evaluation_file_access_url
        - filesize
        - t_max
        - t_min
      include_discovery_flags: true

manifest:
  group_by:
    - source_identifier
  groups_output_field: sbids
  group_key_output_field: sbid
  records_output_field: datasets
  expand_from: metadata
  source_template:
    source_identifier: "{source_identifier}"
    ra_string: "{flags.ra_string}"
    dec_string: "{flags.dec_string}"
    vsys: "{flags.vsys}"
  record_template:
    source_identifier: "{source_identifier}"
    sbid: "{group_key}"
    dataset_id: "{record_id}"
    visibility_filename: "{visibility_filename}"
    scan_id: "{staging_id}"
    access_url: "{access_url}"
    evaluation_file: "{group_artifact_filename}"
    evaluation_file_access_url: "{group_artifact_access_url}"

# Example of a graph patch; DALiuGE uses this to set the output_parser for the CSV node.
graph_patches:
  - match:
      kind: node_name
      equals: process_CSV_str
    set:
      output_parser: pickle
  - match:
      kind: node_name
      equals: Scatter/GenericScatterApp
    set:
      num_of_copies: "$count(sbids[].datasets[])"

# This test graph publishes two small synthetic qualification products.
output_verification:
  required: true
  inventory_schema: beampipe-output-inventory/v1
  expected_patterns:
    - "**/image*.10arc.final_mosaic.fits"
    - "**/weights*.10arc.final_mosaic.fits"

automation:
  execution:
    enabled: false
    archive_name: casda
    max_sources_per_execution: 1
    tick_execution_source_limit: 1000
    tick_execution_run_limit: 50
    min_sources_to_trigger: 1
    max_wait_minutes: 1440
    claim_ttl_minutes: 180
    concurrent_execution_run_limit: 10
    deployment_profile_name: dlg-dim
    execution_slurm_remote_poll_max_rounds: 40
    execution_slurm_remote_poll_interval_seconds: 60
  discovery:
    enabled: true
    tick_discovery_source_limit: 1000
    batch_size: 10
    tick_discovery_batch_limit: 100
    concurrent_discovery_batch_limit: 24
    stale_after_hours: 24
