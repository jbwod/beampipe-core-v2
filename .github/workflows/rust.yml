name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beampipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/beampipe_test
      BEAMPIPE_JWT_SECRET: test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Migration smoke
        run: |
          cargo run -p beampipe-cli -- migrate
          cargo run -p beampipe-cli -- migrate

      - name: Promtool alert rules
        run: bash scripts/promtool-test-alerts.sh

      - name: Installer target mapping
        run: sh deploy/install-target-test.sh

      - name: Checkout setup command
        run: sh deploy/setup-docker-test.sh

      - name: Materialized release installation
        run: |
          install_home="$RUNNER_TEMP/beampipe-install"
          cargo run -p beampipe-cli --bin beampipe -- \
            --home "$install_home" setup --yes --runtime docker --postgres compose \
            --no-start --skip-admin --skip-upload
          docker compose \
            --project-directory "$install_home" \
            --env-file "$install_home/.env" \
            --file "$install_home/docker-compose.yml" \
            config --quiet
          (cd "$RUNNER_TEMP" && cargo run --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            -p beampipe-cli --bin beampipe -- --home "$install_home" status)

      - name: Run tests
        run: cargo test --workspace
